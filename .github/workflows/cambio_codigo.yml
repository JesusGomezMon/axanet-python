name: Cambio de Código (Issue)

on:
  issues:
    types: [opened, labeled]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  validar-cambio:
    name: Validar cambio de código
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      contains(github.event.issue.labels.*.name, 'cambio-codigo')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Verificar compilación
        run: |
          python -m py_compile src/cliente.py
          python -m py_compile src/gestor.py
          python -m py_compile src/app.py
          python -m py_compile src/web.py

      - name: Pruebas de regresión
        run: pytest tests/ -v

      - name: Comentar en issue
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Workflow **cambio_codigo** ejecutado. Compilación y pruebas: OK.'
            })
