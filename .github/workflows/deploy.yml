name: Deploy

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"

jobs:
  deploy:
    name: Despliegue a producción
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas pre-despliegue
        run: pytest tests/ -v

      - name: Preparar artefacto de despliegue
        run: |
          mkdir -p dist
          cp -r src/ dist/
          cp -r data/ dist/
          cp requirements.txt dist/
          echo "Versión: ${{ github.ref_name }}" > dist/VERSION.txt

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: axanet-python-release
          path: dist/
          retention-days: 30

      - name: Simular despliegue
        run: |
          echo "============================================"
          echo "  Despliegue simulado de axanet-python"
          echo "  Rama/Tag: ${{ github.ref_name }}"
          echo "  Commit: ${{ github.sha }}"
          echo "============================================"
          echo "✓ Artefacto generado y listo para producción."
