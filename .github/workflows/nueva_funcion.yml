name: Nueva Función (Issue)

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:

jobs:
  evaluar-funcion:
    name: Evaluar nueva funcionalidad
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'nueva-funcion')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Listar API actual del gestor
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'src')
          from gestor import GestorClientes
          metodos = [m for m in dir(GestorClientes) if not m.startswith('_')]
          print('Metodos disponibles:', ', '.join(metodos))
          "

      - name: Pruebas existentes
        run: pytest tests/ -v

      - name: Comentar en issue
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Workflow **nueva_funcion** ejecutado.\n\nCrear rama `feature/nueva-funcion` para implementar.'
            })
