name: Consulta Cliente (Issue)

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:

jobs:
  procesar-consulta:
    name: Procesar consulta de cliente
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'consulta-cliente')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Ejecutar pruebas de consulta
        run: pytest tests/ -v -k "consultar"

      - name: Comentar en issue
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Workflow **consulta_cliente** ejecutado. Sistema de consulta verificado.'
            })
