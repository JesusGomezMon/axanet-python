{% extends "base.html" %}
{% block title %}{% if accion == 'crear' %}Nuevo{% else %}Editar{% endif %} cliente — Axanet{% endblock %}
{% block content %}
<div class="card">
    <h2>{% if accion == 'crear' %}Crear nuevo cliente{% else %}Editar cliente{% endif %}</h2>
    <form method="POST">
        <label for="nombre">Nombre *</label>
        <input type="text" id="nombre" name="nombre" required
               value="{{ cliente.nombre if cliente else '' }}">

        <label for="correo">Correo *</label>
        <input type="email" id="correo" name="correo" required
               value="{{ cliente.correo if cliente else '' }}">

        <label for="telefono">Teléfono (10 dígitos) *</label>
        <input type="text" id="telefono" name="telefono" required maxlength="10"
               pattern="\d{10}" value="{{ cliente.telefono if cliente else '' }}">

        <label for="direccion">Dirección</label>
        <input type="text" id="direccion" name="direccion"
               value="{{ cliente.direccion if cliente else '' }}">

        <div style="margin-top:1.5rem;display:flex;gap:0.5rem;">
            <button type="submit" class="btn btn-primary">
                {% if accion == 'crear' %}Crear{% else %}Guardar cambios{% endif %}
            </button>
            <a href="{{ url_for('inicio') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
